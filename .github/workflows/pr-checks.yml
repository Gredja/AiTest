name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Restore
        run: dotnet restore

      - name: Format
        run: dotnet format --verify-no-changes

      - name: Analyzers
        run: dotnet format analyzers --verify-no-changes

      - name: HealthCheck (live GitHub API)
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_PAT: ${{ secrets.TEST_PAT }}
        run: dotnet test --filter Category=HealthCheck --verbosity minimal

      - name: HealthCheck skipped for fork PRs
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: echo "Repository secrets are not available to fork PRs — live checks skipped, format and analyzer gates still apply"

      - name: Slack notification
        if: always()
        shell: pwsh
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
        run: ./Scripts/slack-notify-run.ps1 -Title "🔬 PR checks" -Status "${{ job.status }}" -Event "${{ github.event_name }}" -RunUrl "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
