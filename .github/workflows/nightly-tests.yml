name: Nightly full suite

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-full-suite
  cancel-in-progress: false

jobs:
  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Prepare headless testsettings for CI
        run: |
          sed 's/"Headless": false/"Headless": true/' testsettings.example.json > testsettings.json

      - name: Build
        run: dotnet build

      - name: Install Playwright Chromium
        shell: pwsh
        run: ./Scripts/install-playwright.ps1 -WithDeps

      - name: Run API + E2E suite (two-pass)
        shell: pwsh
        env:
          GITHUB_PAT: ${{ secrets.TEST_PAT }}
        run: ./Scripts/test-parallel-rerun.ps1 -Filter "Category!=GitHubUi"

      - name: Rate limit budget
        if: always()
        env:
          GITHUB_PAT: ${{ secrets.TEST_PAT }}
        run: |
          curl -s -H "Authorization: Bearer $GITHUB_PAT" https://api.github.com/rate_limit | grep -o '"remaining":[0-9]*' | head -2 || true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-run-report
          path: |
            TestResults/*.md
            allure-results/
          retention-days: 7
